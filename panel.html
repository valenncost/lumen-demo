<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · Lumen Odontología</title>
  <meta name="description" content="Panel del consultorio: turnos, pacientes y pagos.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F1EA">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body class="has-demo-bar">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-tooth" viewBox="12 10.5 44 45.5"><path d="M24.5 13C18.6 13 15 17.8 15 24c0 5 1.7 8.8 3 13.2 1.6 4.6 2.1 16.8 6.7 16.8 3.9 0 3.7-10.2 6.1-13.9 1-1.5 1.9-2.2 3.2-2.2s2.2.7 3.2 2.2c2.4 3.7 2.2 13.9 6.1 13.9 4.6 0 5.1-12.2 6.7-16.8 1.3-4.4 3-8.2 3-13.2 0-6.2-3.6-11-9.5-11-3.7 0-6.1 2-9.5 2s-5.8-2-9.5-2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>

  <div class="demo-bar" id="demoBar" role="note">
    <span class="demo-bar-sp" aria-hidden="true"></span>
    <span class="demo-bar-txt"><span class="largo">Proyecto demo hecho por </span><span class="corto">Demo por </span><a href="https://instagram.com/cono.agency" target="_blank" rel="noopener"><b>Cono</b><span class="largo"> · cono.agency</span></a></span>
    <span class="demo-bar-acc">
      <a class="demo-bar-btn" href="index.html">← Ver la web del consultorio</a>
      <button class="demo-bar-close" id="demoBarClose" aria-label="Cerrar aviso"><svg><use href="#i-close"/></svg></button>
    </span>
  </div>

  <!-- Ingreso con PIN -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm" autocomplete="off">
      <span class="logo logo--stack">
        <svg class="logo-mark"><use href="#i-tooth"/></svg>
        <span class="logo-text"><b>LUMEN</b><small>ODONTOLOGÍA</small></span>
      </span>
      <h1>Acceso consultorio</h1>
      <p class="login-sub">Ingresá el PIN para ver turnos, pacientes y pagos.</p>
      <label class="pin-wrap" for="pin">
        <span class="sr-only">PIN</span>
        <input id="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-describedby="pinHint pinError">
        <span class="pin-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </label>
      <p class="login-error" id="pinError" role="alert"></p>
      <button class="btn btn--lg btn--block" type="submit">Ingresar</button>
      <p class="login-hint" id="pinHint">Demo: usá 1234</p>
      <a class="login-back" href="index.html">← Volver a la web</a>
    </form>
  </section>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <a href="index.html" class="logo" title="Ver la web">
        <svg class="logo-mark"><use href="#i-tooth"/></svg>
        <span class="logo-text"><b>LUMEN</b><small>ODONTOLOGÍA</small></span>
      </a>
      <nav class="side-nav" id="sideNav" aria-label="Secciones del panel"></nav>
      <div class="side-foot">
        <a class="side-link" href="index.html" target="_blank" rel="noopener" id="verWeb"></a>
        <button class="side-link" id="logout"></button>
      </div>
    </aside>

    <main class="main">
      <header class="page-head">
        <div>
          <p class="eyebrow" id="pageEyebrow"></p>
          <h1 id="pageTitle"></h1>
          <p class="page-sub" id="pageSub"></p>
        </div>
        <div class="page-actions" id="pageActions"></div>
      </header>
      <div id="view"></div>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Secciones del panel"></nav>
  </div>

  <div id="modals"></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
